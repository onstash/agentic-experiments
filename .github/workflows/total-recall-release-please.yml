name: Release Please Total Recall

on:
  push:
    branches: [main]
    paths:
      - "agents/total-recall/**"
      - ".github/workflows/total-recall-release-please.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          config-file: agents/total-recall/release-please-config.json
          manifest-file: agents/total-recall/.release-please-manifest.json
